name: Update GitGrade Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone gitgrade
        run: git clone https://github.com/jubair211/gitgrade.git

      - name: Build gitgrade
        run: cd gitgrade && cargo build --release

      - name: Generate badges and update README
        run: |
          cd gitgrade
          OUTPUT=$(./target/release/gitgrade badge .)
          STREAK=$(echo "$OUTPUT" | grep "GitGrade Streak")
          COMMITS=$(echo "$OUTPUT" | grep "GitGrade Commits")
          STYLE=$(echo "$OUTPUT" | grep "GitGrade Style")
          echo "### Hi there 👋 I am Jubair" > ../README.md
          echo "" >> ../README.md
          echo "$STREAK" >> ../README.md
          echo "$COMMITS" >> ../README.md
          echo "$STYLE" >> ../README.md
          echo "" >> ../README.md
          echo "> Badges generated by [GitGrade](https://jubair211.github.io/gitgrade) — automatic coding habit tracker" >> ../README.md

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update GitGrade badges"
          git push
