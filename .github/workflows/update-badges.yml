name: Update GitGrade Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone gitgrade
        run: git clone https://github.com/jubair211/gitgrade.git

      - name: Build gitgrade
        run: |
          cd gitgrade
          cargo build --release

      - name: Generate badges
        run: |
          cd gitgrade
          BADGE_OUTPUT=$(./target/release/gitgrade badge .)
          STREAK=$(echo "$BADGE_OUTPUT" | grep "streak" | head -1)
          COMMITS=$(echo "$BADGE_OUTPUT" | grep "commits" | head -1)
          STYLE=$(echo "$BADGE_OUTPUT" | grep "style" | head -1)
          cat > ../README.md << README
          ### Hi there 👋 I am Jubair

          $STREAK
          $COMMITS
          $STYLE

          > Badges generated by [GitGrade](https://jubair211.github.io/gitgrade) — automatic coding habit tracker
          README

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update GitGrade badges"
          git push
