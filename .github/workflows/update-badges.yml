name: Update GitGrade Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate badges from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/search/commits?q=author:jubair211" \
            -H "Accept: application/vnd.github.cloak-preview" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])")

          TODAY=$(date +%Y-%m-%d)
          STREAK=0

          for i in $(seq 0 30); do
            CHECK_DATE=$(date -d "$TODAY - $i days" +%Y-%m-%d)
            ACTIVITY=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/search/commits?q=author:jubair211+committer-date:$CHECK_DATE" \
              -H "Accept: application/vnd.github.cloak-preview" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['total_count'])")
            if [ "$ACTIVITY" -gt "0" ]; then
              STREAK=$((STREAK + 1))
            else
              break
            fi
          done

          if [ "$STREAK" -ge 7 ]; then STREAK_COLOR="00d4aa"
          elif [ "$STREAK" -ge 3 ]; then STREAK_COLOR="6366f1"
          else STREAK_COLOR="f59e0b"; fi

          if [ "$COMMITS" -ge 100 ]; then COMMIT_COLOR="00d4aa"
          elif [ "$COMMITS" -ge 50 ]; then COMMIT_COLOR="6366f1"
          else COMMIT_COLOR="f59e0b"; fi

          HOUR=$(date +%H)
          if [ "$HOUR" -ge 22 ] || [ "$HOUR" -lt 4 ]; then STYLE="night+coder"
          elif [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 12 ]; then STYLE="morning+coder"
          elif [ "$HOUR" -ge 13 ] && [ "$HOUR" -le 17 ]; then STYLE="afternoon+coder"
          else STYLE="evening+coder"; fi

          echo "### Hi there 👋 I am Jubair" > README.md
          echo "" >> README.md
          echo "![GitGrade Streak](https://img.shields.io/badge/streak-${STREAK}%20days-${STREAK_COLOR}?style=flat&logo=git&logoColor=white)" >> README.md
          echo "![GitGrade Commits](https://img.shields.io/badge/commits-${COMMITS}-${COMMIT_COLOR}?style=flat&logo=git&logoColor=white)" >> README.md
          echo "![GitGrade Style](https://img.shields.io/badge/style-${STYLE}-00d4aa?style=flat&logo=git&logoColor=white)" >> README.md
          echo "" >> README.md
          echo "> Badges generated by [GitGrade](https://jubair211.github.io/gitgrade) — automatic coding habit tracker" >> README.md

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update GitGrade badges"
          git push
